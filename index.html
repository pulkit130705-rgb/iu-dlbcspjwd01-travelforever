

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Forever - Tours</title>
    <style>
        body{
            font-family: Arial;
            padding: 20px;
            background: #f5f5f7;
        }
        h1{
            text-align: center;
            color: #333;
        }
        #search{
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .tour-card{
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tour-card h3{
            margin: 0 0 10px 0;
            color: #007aff;
        }
    </style>
</head>
<body>
    <h1>Travel Forever - Phase 2</h1>
    
    <input type="text" id="search" placeholder="Search city like Mumbai, Delhi, Goa ...">
    
    <div id="tour-list">Loading tours...</div>

    <script src="app.js"></script>
</body>
</html>
